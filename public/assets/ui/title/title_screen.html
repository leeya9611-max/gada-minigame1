<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>야리끼리 대소동 — 타이틀 화면 목업</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#20232a; display:flex; align-items:center; justify-content:center; min-height:100vh; font-family:'Jua',sans-serif; }

  /* 16:9 무대. 게임 논리 해상도 800x450 기준, 화면에 맞춰 스케일 */
  .stage {
    position:relative; width:min(96vw, 960px); aspect-ratio:16/9;
    overflow:hidden; border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,.5);
    /* 키아트가 없을 때 보이는 폴백 하늘(석양) */
    background:linear-gradient(180deg,#7b6cc4 0%,#c98fb0 42%,#f4a967 74%,#f6c98a 100%);
  }
  /* 실제 키아트: 같은 폴더에 keyart.png 넣으면 배경으로 깔림 */
  .keyart { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }

  /* 폴백 배경용 간단 실루엣 (키아트 있으면 가려짐) */
  .silo { position:absolute; bottom:14%; opacity:.28; background:#5b4a7a; }
  .b1 { left:6%;  width:12%; height:34%; }
  .b2 { left:20%; width:9%;  height:46%; }
  .b3 { right:10%;width:14%; height:40%; }
  .ground { position:absolute; left:0; right:0; bottom:0; height:16%; background:#b5763f; opacity:.55; }

  /* 상단 그라데이션 오버레이(로고 가독성) */
  .veil { position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,15,40,.28),rgba(0,0,0,0) 40%); }

  .wrap { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; }

  /* ── 메인 로고: 야리끼리 대소동 ── */
  .logo-box { position:relative; margin-top:6%; transform:rotate(-2deg); text-align:center; line-height:.9; }
  .logo { font-family:'Black Han Sans',sans-serif; font-size:clamp(34px,9vw,88px); letter-spacing:1px; }
  .logo.back  { position:absolute; inset:0; color:#3a220f; -webkit-text-stroke:16px #3a220f; }
  .logo.mid   { position:absolute; inset:0; color:#fff;    -webkit-text-stroke:9px  #ffffff; }
  .logo.front { position:relative; color:#FFD23F; -webkit-text-stroke:2px #b9781a;
                text-shadow:0 8px 0 #b9781a, 0 14px 20px rgba(0,0,0,.35); }

  /* ── 서브 타이틀 리본: 퇴근길 런런런! ── */
  .ribbon { margin-top:2.6%; transform:rotate(-1deg);
    background:#E24B4A; color:#fff; font-size:clamp(15px,3.4vw,30px);
    padding:.28em 1.5em; border:3px solid #fff;
    box-shadow:0 6px 0 #9e2f2e, 0 10px 16px rgba(0,0,0,.3);
    clip-path:polygon(4% 0,96% 0,100% 50%,96% 100%,4% 100%,0 50%); }

  /* ── 시작 버튼 ── */
  .btns { position:absolute; bottom:9%; width:100%; display:flex; flex-direction:column; align-items:center; gap:12px; }
  .start { font-family:'Jua',sans-serif; font-size:clamp(16px,3.6vw,30px); color:#5b3a0c;
    background:#FFC01D; border:3px solid #fff; border-radius:999px; padding:.42em 2.1em;
    box-shadow:0 7px 0 #c8901a, 0 12px 18px rgba(0,0,0,.32); cursor:pointer; }
  .start:active { transform:translateY(3px); box-shadow:0 4px 0 #c8901a, 0 8px 12px rgba(0,0,0,.3); }
  .subrow { display:flex; gap:10px; }
  .mini { font-family:'Jua',sans-serif; font-size:clamp(11px,2.4vw,16px); color:#fff;
    background:rgba(0,0,0,.32); border:2px solid rgba(255,255,255,.7); border-radius:999px; padding:.3em 1.1em; cursor:pointer; }

  .note { position:fixed; bottom:10px; left:0; right:0; text-align:center; color:#8a8f99; font-size:12px; }
</style>
</head>
<body>
  <div class="stage">
    <div class="b1 silo"></div><div class="b2 silo"></div><div class="b3 silo"></div>
    <div class="ground"></div>
    <img class="keyart" src="./keyart.png" alt="" onerror="this.style.display='none'">
    <div class="veil"></div>

    <div class="wrap">
      <div class="logo-box">
        <div class="logo back">야리끼리 대소동</div>
        <div class="logo mid">야리끼리 대소동</div>
        <div class="logo front">야리끼리 대소동</div>
      </div>
      <div class="ribbon">퇴근길 런런런!</div>

      <div class="btns">
        <button class="start">퇴근 시작!</button>
        <div class="subrow">
          <button class="mini">최고기록</button>
          <button class="mini">상점</button>
        </div>
      </div>
    </div>
  </div>
  <div class="note">keyart.png 를 이 파일과 같은 폴더에 넣으면 배경이 실제 키아트로 바뀝니다. (현재는 폴백 석양 배경)</div>
</body>
</html>
